<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuMigos - Configurações da Conta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="config-page">

    <header class="config-header-bar">
        <div class="navbar-calendar">
            <span class="day" id="headerDay"></span>
            <span class="month" id="headerMonth"></span>
        </div>

        <a href="#" id="configLogoLink" class="navbar-logo-link">
            <img src="../assets/img/Prancheta 4.png" alt="AuMigos Logo Branca">
        </a>

        <div class="navbar-profile">
            <span class="profile-name" id="navbarOngNome"></span>
        </div>
    </header>

    <div class="config-main-container">

        <div class="config-title-section">
            <h1>Configurações da Conta</h1>
        </div>

        <div class="config-layout">

            <div class="config-left-column">
                <aside class="config-sidebar">
                    <a href="#" class="sidebar-item active" id="sidebarPerfilLabel">Perfil</a>
                    <a href="#" class="sidebar-item normal">Segurança</a>
                    <a href="../index.html" class="sidebar-item danger">Log out</a>
                </aside>

                <div class="config-back-container">
                    <a href="#" id="btnVoltar" class="config-btn-voltar">Voltar</a>
                </div>
            </div>

            <main class="config-content-card">
                <form id="configForm">
                    <input type="hidden" id="config-id-endereco" name="id_endereco">

                    <!-- Dados Pessoais -->
                    <p class="config-section-label">Dados Pessoais</p>
                    <div class="config-form-grid">

                        <div class="config-input-group">
                            <label>Nome Completo</label>
                            <input type="text" placeholder="Nome" name="nome" id="config-nome">
                        </div>

                        <div class="config-input-group">
                            <label>E-mail</label>
                            <input type="email" placeholder="E-mail" name="email" id="config-email">
                        </div>

                        <div class="config-input-group">
                            <label>Documento (CPF/CNPJ)</label>
                            <input type="text" id="config-documento" class="config-input-disabled" disabled>
                        </div>

                        <div class="config-input-group">
                            <label>Telefone</label>
                            <input type="tel" placeholder="Telefone" name="telefone" id="config-telefone">
                        </div>

                        <div class="config-input-group config-campo-nao-ong">
                            <label>Data de Nascimento</label>
                            <input type="date" name="dataNascimento" id="config-data-nascimento">
                        </div>

                        <div class="config-input-group config-campo-apoiador">
                            <label>Profissão</label>
                            <input type="text" placeholder="Profissão" name="profissao" id="config-profissao">
                        </div>

                        <div class="config-input-group config-campo-apoiador">
                            <label>Gênero</label>
                            <select name="genero" id="config-genero" class="config-select">
                                <option value="">Selecione</option>
                                <option value="Masculino">Masculino</option>
                                <option value="Feminino">Feminino</option>
                                <option value="Outro">Outro</option>
                                <option value="Prefiro não dizer">Prefiro não dizer</option>
                            </select>
                        </div>

                        <div class="config-input-group">
                            <label>Tipo de Conta</label>
                            <input type="text" id="config-tipo-conta" class="config-input-disabled" disabled>
                        </div>

                        <div class="config-input-group">
                            <label>Data de Cadastro</label>
                            <input type="text" id="config-data-cadastro" class="config-input-disabled" disabled>
                        </div>

                        <div class="config-input-group">
                            <label>Status (Ativo)</label>
                            <input type="text" id="config-ativo" class="config-input-disabled" disabled>
                        </div>

                    </div>

                    <!-- Segurança -->
                    <p class="config-section-label" style="margin-top: 36px;">Segurança</p>
                    <div class="config-form-grid">

                        <div class="config-input-group config-full-width">
                            <label>Nova Senha</label>
                            <input type="password" placeholder="Deixe em branco para manter a senha atual" name="senha" id="config-senha">
                        </div>

                    </div>

                    <!-- Endereço -->
                    <p class="config-section-label" style="margin-top: 36px;">Endereço</p>
                    <div class="config-form-grid">

                        <div class="config-input-group">
                            <label>Tipo de Logradouro</label>
                            <select name="logradouro_tipo" id="config-logradouro-tipo" class="config-select">
                                <option value="">Selecione</option>
                                <option value="Rua">Rua</option>
                                <option value="Avenida">Avenida</option>
                                <option value="Alameda">Alameda</option>
                                <option value="Travessa">Travessa</option>
                                <option value="Praça">Praça</option>
                                <option value="Rodovia">Rodovia</option>
                            </select>
                        </div>

                        <div class="config-input-group">
                            <label>Nome do Logradouro</label>
                            <input type="text" placeholder="Ex: XV de Novembro" name="logradouro_nome" id="config-logradouro-nome">
                        </div>

                        <div class="config-input-group">
                            <label>Número</label>
                            <input type="text" placeholder="Ex: 123" name="numero" id="config-numero">
                        </div>

                        <div class="config-input-group">
                            <label>CEP</label>
                            <input type="text" placeholder="Ex: 80010-000" name="cep" id="config-cep">
                        </div>

                        <div class="config-input-group">
                            <label>Bairro</label>
                            <input type="text" placeholder="Ex: Centro" name="bairro" id="config-bairro">
                        </div>

                        <div class="config-input-group">
                            <label>Complemento</label>
                            <input type="text" placeholder="Ex: Apto 101" name="complemento" id="config-complemento">
                        </div>

                        <div class="config-input-group">
                            <label>Cidade</label>
                            <input type="text" placeholder="Ex: Curitiba" name="cidade" id="config-cidade">
                        </div>

                        <div class="config-input-group">
                            <label>Estado</label>
                            <select name="estado" id="config-estado" class="config-select">
                                <option value="">Selecione</option>
                                <option value="AC">AC</option><option value="AL">AL</option>
                                <option value="AP">AP</option><option value="AM">AM</option>
                                <option value="BA">BA</option><option value="CE">CE</option>
                                <option value="DF">DF</option><option value="ES">ES</option>
                                <option value="GO">GO</option><option value="MA">MA</option>
                                <option value="MT">MT</option><option value="MS">MS</option>
                                <option value="MG">MG</option><option value="PA">PA</option>
                                <option value="PB">PB</option><option value="PR">PR</option>
                                <option value="PE">PE</option><option value="PI">PI</option>
                                <option value="RJ">RJ</option><option value="RN">RN</option>
                                <option value="RS">RS</option><option value="RO">RO</option>
                                <option value="RR">RR</option><option value="SC">SC</option>
                                <option value="SP">SP</option><option value="SE">SE</option>
                                <option value="TO">TO</option>
                            </select>
                        </div>

                    </div>

                    <div class="config-form-actions">
                        <div id="configFeedback" class="config-feedback" aria-live="polite"></div>
                        <button type="submit" class="config-btn-salvar">Salvar Alterações</button>
                    </div>

                </form>
            </main>

        </div>

    </div>
    <script src="../assets/js/script.js"></script>
</body>

</html>
