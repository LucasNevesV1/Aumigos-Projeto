<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuMigos - Registro de Animal</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="registro-page">

    <div class="modal-container">
        <button class="btn-close" title="Fechar" onclick="window.location.href='consulta-animal.html'">&times;</button>

        <div class="form-content">
            <h2>Registro de Animal</h2>

            <form id="registroAnimalForm">

                <!-- STEP 1: Dados Básicos -->
                <div id="step1" class="step active">
                    <div class="subtitle">Dados Básicos</div>

                    <div class="form-grid">

                        <div class="input-group">
                            <label>Nome</label>
                            <input type="text" id="campo-nome" placeholder="Nome do animal">
                        </div>

                        <div class="input-group" style="justify-content: flex-end; padding-bottom: 5px;">
                            <div class="photo-upload">
                                <div class="photo-icon">📷</div>
                                <span>Adicionar Foto</span>
                            </div>
                        </div>

                        <div class="input-group">
                            <label>Espécie</label>
                            <select id="campo-especie">
                                <option value=""></option>
                                <option value="Cachorro">Cachorro</option>
                                <option value="Gato">Gato</option>
                            </select>
                        </div>

                        <div class="input-group">
                            <label>Data de Nascimento</label>
                            <input type="date" id="campo-nascimento">
                        </div>

                        <div class="input-group">
                            <label>Raça</label>
                            <input type="text" id="campo-raca" placeholder="Ex: Vira-lata, Labrador">
                        </div>

                        <div class="input-group">
                            <label>Cor</label>
                            <input type="text" id="campo-cor" placeholder="Ex: Caramelo, Preto e branco">
                        </div>

                        <div class="input-group">
                            <label>Gênero</label>
                            <div class="gender-toggle">
                                <button type="button" id="btn-femea" class="active">Fêmea</button>
                                <button type="button" id="btn-macho">Macho</button>
                            </div>
                        </div>

                        <div class="input-group">
                            <label>Porte</label>
                            <select id="campo-porte">
                                <option value=""></option>
                                <option value="Pequeno">Pequeno</option>
                                <option value="Médio">Médio</option>
                                <option value="Grande">Grande</option>
                            </select>
                        </div>

                        <div class="input-group">
                            <label>Idade Aproximada (anos)</label>
                            <input type="number" id="campo-idade" min="0" max="30" placeholder="Ex: 2">
                        </div>

                        <div class="input-group">
                            <label>Residente no Abrigo</label>
                            <div class="gender-toggle">
                                <button type="button" id="btn-abrigo-sim" class="active">Sim</button>
                                <button type="button" id="btn-abrigo-nao">Não</button>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- STEP 2: Dados de Entrada -->
                <div id="step2" class="step">
                    <div class="subtitle">Dados de Entrada</div>

                    <div class="form-grid">

                        <div class="input-group full-width" style="max-width: 48%;">
                            <label>Data de Entrada</label>
                            <input type="date" id="campo-entrada">
                        </div>

                        <div class="input-group">
                            <label>Motivo da Entrada</label>
                            <select id="campo-motivo">
                                <option value=""></option>
                                <option value="Resgate">Resgate</option>
                                <option value="Abandono">Abandono</option>
                                <option value="Devolução">Devolução</option>
                                <option value="Entrega voluntária">Entrega voluntária</option>
                            </select>
                        </div>

                        <div class="input-group">
                            <label>Status de Saúde</label>
                            <select id="campo-saude">
                                <option value=""></option>
                                <option value="Saudável">Saudável</option>
                                <option value="Ferido">Ferido</option>
                                <option value="Doente">Doente</option>
                                <option value="Debilitado">Debilitado</option>
                            </select>
                        </div>

                        <div class="input-group full-width">
                            <label>Descrição / Observações</label>
                            <textarea id="campo-descricao" placeholder="Descreva o estado do animal, histórico, comportamento..."></textarea>
                        </div>

                    </div>
                </div>

            </form>
        </div>

        <div class="modal-footer" id="modalFooter"></div>
    </div>

    <script>
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const modalFooter = document.getElementById('modalFooter');
        const registroForm = document.getElementById('registroAnimalForm');

        const urlParams = new URLSearchParams(window.location.search);
        const editId = urlParams.get('id');

        // Toggle genérico para grupos de botões
        document.addEventListener('click', function (e) {
            const parent = e.target.parentElement;
            if (parent && parent.classList.contains('gender-toggle')) {
                parent.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
            }
        });

        function getToggleValue(simId, naoId) {
            return document.getElementById(simId).classList.contains('active');
        }

        function setToggle(simId, naoId, value) {
            const isTrue = value == 1 || value === true || value === 'Sim';
            document.getElementById(simId).classList.toggle('active', isTrue);
            document.getElementById(naoId).classList.toggle('active', !isTrue);
        }

        function setSelect(id, value) {
            const el = document.getElementById(id);
            if (!el || !value) return;
            // Busca case-insensitive
            const lower = String(value).toLowerCase();
            for (const opt of el.options) {
                if (opt.value.toLowerCase() === lower) { el.value = opt.value; return; }
            }
            el.value = value; // fallback direto
        }

        // Carrega dados ao editar
        if (editId) {
            document.querySelector('h2').textContent = 'Editar Animal';
            fetch(`../actions/animal.php?action=listar`)
                .then(r => r.json())
                .then(lista => {
                    const a = lista.find(x => String(x.id_animal) === editId);
                    if (!a) return;

                    document.getElementById('campo-nome').value      = a.nome           || '';
                    document.getElementById('campo-raca').value      = a.raca           || '';
                    document.getElementById('campo-nascimento').value = a.dataNascimento || '';
                    document.getElementById('campo-cor').value       = a.cor            || '';
                    document.getElementById('campo-entrada').value   = a.dataEntrada    || '';
                    document.getElementById('campo-descricao').value = a.descricaoEntrada || a.descricao || '';
                    document.getElementById('campo-idade').value     = a.idadeAproximada != null ? a.idadeAproximada : '';

                    setSelect('campo-especie', a.especie);
                    setSelect('campo-porte',   a.tamanho);
                    setSelect('campo-motivo',  a.motivoEntrada);
                    setSelect('campo-saude',   a.statusSaude);

                    // Gênero
                    if (a.genero === 'Macho') {
                        document.getElementById('btn-femea').classList.remove('active');
                        document.getElementById('btn-macho').classList.add('active');
                    }

                    // Residente no abrigo
                    setToggle('btn-abrigo-sim', 'btn-abrigo-nao', a.residenteAbrigo);
                });
        }

        function showStep(n) {
            if (n === 1) {
                step1.classList.add('active');
                step2.classList.remove('active');
                modalFooter.innerHTML = `<button type="button" class="btn btn-primary" onclick="showStep(2)">Próximo</button>`;
            } else {
                step1.classList.remove('active');
                step2.classList.add('active');
                modalFooter.innerHTML = `
                    <button type="button" class="btn btn-secondary" onclick="showStep(1)">Voltar</button>
                    <button type="submit" form="registroAnimalForm" class="btn btn-primary">${editId ? 'Salvar' : 'Finalizar'}</button>
                `;
            }
        }

        registroForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            try {
                const generoAtivo  = step1.querySelector('.gender-toggle:first-of-type button.active');
                const abrigoAtivo  = document.getElementById('btn-abrigo-sim').classList.contains('active');

                const dados = {
                    action:           editId ? 'editar' : 'criar',
                    id:               editId ? Number(editId) : undefined,
                    nome:             document.getElementById('campo-nome').value      || 'Sem nome',
                    especie:          document.getElementById('campo-especie').value   || '',
                    raca:             document.getElementById('campo-raca').value      || '',
                    genero:           generoAtivo ? generoAtivo.innerText : 'Fêmea',
                    dataNascimento:   document.getElementById('campo-nascimento').value || '',
                    cor:              document.getElementById('campo-cor').value       || '',
                    tamanho:          document.getElementById('campo-porte').value     || '',
                    idadeAproximada:  document.getElementById('campo-idade').value !== '' ? Number(document.getElementById('campo-idade').value) : null,
                    residenteAbrigo:  abrigoAtivo ? 1 : 0,
                    descricao:        document.getElementById('campo-descricao').value || '',
                    dataEntrada:      document.getElementById('campo-entrada').value   || '',
                    motivoEntrada:    document.getElementById('campo-motivo').value    || '',
                    statusSaude:      document.getElementById('campo-saude').value     || '',
                };

                const res  = await fetch('../actions/animal.php', {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify(dados)
                });
                const json = await res.json();
                if (json.erro) throw new Error(json.erro);

                alert(editId ? 'Animal atualizado com sucesso!' : 'Animal registrado com sucesso!');
                window.location.href = 'consulta-animal.html';
            } catch (err) {
                alert('Ocorreu um erro ao salvar o animal.');
                console.error(err);
            }
        });

        showStep(1);
    </script>
</body>

</html>
