<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuMigos - Logs de Auditoria</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .audit-section {
            padding: 24px 0;
        }

        .audit-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #391F01;
            margin-bottom: 16px;
        }

        .audit-filters {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .audit-filters input,
        .audit-filters select {
            padding: 8px 14px;
            border: 2px solid #e0cbb8;
            border-radius: 10px;
            font-size: 0.9rem;
            font-family: inherit;
            color: #391F01;
            background: #fff;
            outline: none;
        }

        .audit-filters input:focus,
        .audit-filters select:focus {
            border-color: #C97D2E;
        }

        .audit-filters input {
            flex: 1;
            min-width: 200px;
        }

        .btn-filtrar {
            padding: 8px 20px;
            background: #C97D2E;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-filtrar:hover {
            background: #a8641f;
        }

        .audit-table-wrap {
            overflow-x: auto;
            border-radius: 14px;
            box-shadow: 0 2px 12px rgba(57,31,1,.08);
            background: #fff;
        }

        .audit-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .audit-table thead {
            background: #391F01;
            color: #fff;
        }

        .audit-table thead th {
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            white-space: nowrap;
        }

        .audit-table tbody tr {
            border-bottom: 1px solid #f0e8de;
            transition: background .15s;
        }

        .audit-table tbody tr:hover {
            background: #fdf7f0;
        }

        .audit-table tbody td {
            padding: 10px 16px;
            vertical-align: middle;
            color: #391F01;
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .badge-login       { background: #d4edda; color: #155724; }
        .badge-login-falha { background: #f8d7da; color: #721c24; }
        .badge-cadastro    { background: #cce5ff; color: #004085; }
        .badge-animal      { background: #fff3cd; color: #856404; }
        .badge-adocao      { background: #e2d9f3; color: #4a235a; }
        .badge-status      { background: #fde8d0; color: #7d3c00; }
        .badge-perfil      { background: #d1ecf1; color: #0c5460; }
        .badge-default     { background: #e9ecef; color: #495057; }

        .audit-empty {
            text-align: center;
            padding: 40px;
            color: #9b8a7a;
            font-style: italic;
        }

        .audit-pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            font-size: 0.85rem;
            color: #6b5040;
        }

        .pagination-btns {
            display: flex;
            gap: 8px;
        }

        .pagination-btns button {
            padding: 6px 16px;
            border: 2px solid #e0cbb8;
            border-radius: 8px;
            background: #fff;
            color: #391F01;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .pagination-btns button:disabled {
            opacity: .4;
            cursor: default;
        }

        .pagination-btns button:not(:disabled):hover {
            border-color: #C97D2E;
            color: #C97D2E;
        }

        .audit-counter {
            background: #fdf0e0;
            border-radius: 10px;
            padding: 10px 18px;
            margin-bottom: 16px;
            font-size: 0.88rem;
            color: #6b5040;
        }

        .audit-counter strong {
            color: #391F01;
        }
    </style>
</head>

<body class="dashboard-page">

    <nav class="floating-navbar" id="floatingNavbar">
        <div class="navbar-content">
            <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path class="burger-line" d="M3 6H21" stroke="#391F01" stroke-width="3" stroke-linecap="round" />
                    <path class="burger-line" d="M3 12H21" stroke="#391F01" stroke-width="3" stroke-linecap="round" />
                    <path class="burger-line" d="M3 18H21" stroke="#391F01" stroke-width="3" stroke-linecap="round" />
                </svg>
            </button>

            <img src="../assets/img/Prancheta 5.png" alt="AuMigos Logo" class="navbar-logo" id="navLogo">

            <span class="profile-name-nav">Administrador</span>
        </div>

        <div class="dropdown-menu" id="mainDropdown">
            <ul class="menu-list">
                <li><a href="admin.html">Painel Admin</a></li>
                <li><a href="logs-auditoria.html">Logs de Auditoria</a></li>
            </ul>
            <a href="../index.html" class="menu-sair">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
                Sair da conta
            </a>
        </div>
    </nav>

    <div class="dashboard-container">

        <header class="dash-header">
            <div class="dash-header__content">
                <h1>Logs de Auditoria</h1>
                <p>Rastreamento de todas as ações realizadas no sistema — em conformidade com a LGPD.</p>
            </div>
        </header>

        <main class="dash-main">
            <section class="audit-section">

                <div class="audit-filters">
                    <input type="text" id="inputBusca" placeholder="Buscar por usuário ou descrição..." />
                    <select id="selectAcao">
                        <option value="">Todas as ações</option>
                        <option value="LOGIN">Login</option>
                        <option value="LOGIN_FALHA">Login inválido</option>
                        <option value="CADASTRO_USUARIO">Cadastro de usuário</option>
                        <option value="CADASTRO_ANIMAL">Cadastro de animal</option>
                        <option value="EDICAO_ANIMAL">Edição de animal</option>
                        <option value="EXCLUSAO_ANIMAL">Exclusão de animal</option>
                        <option value="STATUS_ANIMAL">Alteração de status</option>
                        <option value="INTERESSE_ADOCAO">Solicitação de adoção</option>
                        <option value="ADOCAO_APROVADA">Adoção aprovada</option>
                        <option value="ADOCAO_REJEITADA">Adoção rejeitada</option>
                        <option value="EDICAO_PERFIL">Edição de perfil</option>
                        <option value="DESATIVACAO_USUARIO">Desativação de conta</option>
                        <option value="REATIVACAO_USUARIO">Reativação de conta</option>
                        <option value="EXCLUSAO_USUARIO">Exclusão de conta</option>
                        <option value="TENTATIVA_EXCLUSAO_USUARIO">Tentativa de exclusão bloqueada</option>
                        <option value="SOLICITACAO_REATIVACAO">Solicitação de reativação</option>
                    </select>
                    <button class="btn-filtrar" onclick="carregarLogs(1)">Filtrar</button>
                </div>

                <div class="audit-counter" id="auditCounter">Carregando...</div>

                <div class="audit-table-wrap">
                    <table class="audit-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Data / Hora</th>
                                <th>Usuário</th>
                                <th>Ação</th>
                                <th>Tabela</th>
                                <th>ID Reg.</th>
                                <th>Descrição</th>
                                <th>IP</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaLogs">
                            <tr><td colspan="8" class="audit-empty">Carregando logs...</td></tr>
                        </tbody>
                    </table>
                </div>

                <div class="audit-pagination">
                    <span id="paginacaoInfo"></span>
                    <div class="pagination-btns">
                        <button id="btnAnterior" onclick="mudarPagina(-1)" disabled>&#8592; Anterior</button>
                        <button id="btnProximo"  onclick="mudarPagina(1)">Próxima &#8594;</button>
                    </div>
                </div>

            </section>
        </main>

        <footer class="dash-footer">
            <img src="../assets/img/Prancheta 4.png" alt="Logo AuMigos Branca">
        </footer>

    </div>

    <script src="../assets/js/script.js"></script>
    <script>
        let paginaAtual = 1;
        let totalRegistros = 0;
        const LIMITE = 50;

        const LABELS = {
            LOGIN:            { label: 'Login',               cls: 'badge-login' },
            LOGIN_FALHA:      { label: 'Login inválido',      cls: 'badge-login-falha' },
            CADASTRO_USUARIO: { label: 'Cadastro usuário',    cls: 'badge-cadastro' },
            CADASTRO_ANIMAL:  { label: 'Cadastro animal',     cls: 'badge-animal' },
            EDICAO_ANIMAL:    { label: 'Edição animal',       cls: 'badge-animal' },
            EXCLUSAO_ANIMAL:  { label: 'Exclusão animal',     cls: 'badge-animal' },
            STATUS_ANIMAL:    { label: 'Status animal',       cls: 'badge-status' },
            INTERESSE_ADOCAO: { label: 'Solicitação adoção',  cls: 'badge-adocao' },
            ADOCAO_APROVADA:  { label: 'Adoção aprovada',     cls: 'badge-adocao' },
            ADOCAO_REJEITADA: { label: 'Adoção rejeitada',    cls: 'badge-login-falha' },
            EDICAO_PERFIL:              { label: 'Edição perfil',            cls: 'badge-perfil' },
            DESATIVACAO_USUARIO:        { label: 'Desativação conta',        cls: 'badge-status' },
            REATIVACAO_USUARIO:         { label: 'Reativação conta',         cls: 'badge-login' },
            EXCLUSAO_USUARIO:           { label: 'Exclusão conta',           cls: 'badge-login-falha' },
            TENTATIVA_EXCLUSAO_USUARIO: { label: 'Tentativa exclusão',       cls: 'badge-status' },
            SOLICITACAO_REATIVACAO:     { label: 'Solicitação reativação',   cls: 'badge-cadastro' },
            LOGIN_CONTA_DESATIVADA:     { label: 'Login conta desativada',   cls: 'badge-login-falha' },
        };

        function badgeAcao(acao) {
            const info = LABELS[acao] ?? { label: acao, cls: 'badge-default' };
            return `<span class="badge ${info.cls}">${info.label}</span>`;
        }

        function formatarData(dt) {
            if (!dt) return '—';
            return new Date(dt).toLocaleString('pt-BR');
        }

        async function carregarLogs(pagina = 1) {
            paginaAtual = pagina;
            const busca = encodeURIComponent(document.getElementById('inputBusca').value.trim());
            const acao  = encodeURIComponent(document.getElementById('selectAcao').value);

            const url = `../actions/logs.php?pagina=${pagina}&busca=${busca}&acao=${acao}`;

            try {
                const res  = await fetch(url, { credentials: 'include' });
                const data = await res.json();

                if (data.erro) {
                    document.getElementById('tabelaLogs').innerHTML =
                        `<tr><td colspan="8" class="audit-empty">${data.erro}</td></tr>`;
                    document.getElementById('auditCounter').textContent = '';
                    return;
                }

                totalRegistros = data.total;
                renderizarTabela(data.logs);
                atualizarPaginacao(data.total, pagina, data.limite);

            } catch (e) {
                document.getElementById('tabelaLogs').innerHTML =
                    `<tr><td colspan="8" class="audit-empty">Erro ao carregar logs.</td></tr>`;
            }
        }

        function renderizarTabela(logs) {
            const tbody = document.getElementById('tabelaLogs');
            if (!logs || logs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="audit-empty">Nenhum log encontrado.</td></tr>`;
                return;
            }

            tbody.innerHTML = logs.map(l => `
                <tr>
                    <td>${l.id}</td>
                    <td>${formatarData(l.data_hora)}</td>
                    <td>${l.usuario_nome}</td>
                    <td>${badgeAcao(l.acao)}</td>
                    <td>${l.tabela_afetada ?? '—'}</td>
                    <td>${l.id_registro ?? '—'}</td>
                    <td>${l.descricao ?? '—'}</td>
                    <td>${l.ip_origem ?? '—'}</td>
                </tr>
            `).join('');
        }

        function atualizarPaginacao(total, pagina, limite) {
            const inicio = total === 0 ? 0 : (pagina - 1) * limite + 1;
            const fim    = Math.min(pagina * limite, total);

            document.getElementById('auditCounter').innerHTML =
                `Exibindo <strong>${inicio}–${fim}</strong> de <strong>${total}</strong> registros`;
            document.getElementById('paginacaoInfo').textContent =
                `Página ${pagina} de ${Math.ceil(total / limite) || 1}`;

            document.getElementById('btnAnterior').disabled = pagina <= 1;
            document.getElementById('btnProximo').disabled  = pagina * limite >= total;
        }

        function mudarPagina(delta) {
            carregarLogs(paginaAtual + delta);
        }

        document.getElementById('inputBusca').addEventListener('keydown', e => {
            if (e.key === 'Enter') carregarLogs(1);
        });

        carregarLogs(1);
    </script>

</body>

</html>
