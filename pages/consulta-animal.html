<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuMigos - Consulta de Animais</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/script.js" defer></script>
</head>

<body class="consulta-page">

    <nav class="floating-navbar nav-consulta" id="floatingNavbar">
        <div class="navbar-content">
            <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path class="burger-line" d="M3 6H21" stroke="#391F01" stroke-width="3" stroke-linecap="round" />
                    <path class="burger-line" d="M3 12H21" stroke="#391F01" stroke-width="3" stroke-linecap="round" />
                    <path class="burger-line" d="M3 18H21" stroke="#391F01" stroke-width="3" stroke-linecap="round" />
                </svg>
            </button>

            <img src="../assets/img/Prancheta 4.png" alt="AuMigos Logo" class="navbar-logo" id="navLogo">

            <span class="profile-name-nav" id="navbarOngNome"></span>
        </div>

        <div class="dropdown-menu" id="mainDropdown">
            <ul class="menu-list">
                <li><a href="tela-inicial-ongs.html">Tela inicial</a></li>
                <li><a href="consulta-animal.html">Animais do Abrigo</a></li>
                <li><a href="estoque.html">Estoque</a></li>
                <li><a href="financeiro.html">Financeiro</a></li>
                <li><a href="tela_config_usuario.html">Configurações</a></li>
            </ul>
            <a href="../index.html" class="menu-sair">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
                Sair da conta
            </a>
        </div>
    </nav>

    <div class="consulta-container">
        <div class="consulta-header-row">
            <h1 class="consulta-title">Consulta de Animais</h1>
            <div class="consulta-stats">
                <div class="stat-card">
                    <span class="stat-num" id="statTotal">0</span>
                    <span class="stat-label">Total</span>
                </div>
                <div class="stat-card stat-disponivel">
                    <span class="stat-num" id="statDisponivel">0</span>
                    <span class="stat-label">Disponíveis</span>
                </div>
                <div class="stat-card stat-tratamento">
                    <span class="stat-num" id="statTratamento">0</span>
                    <span class="stat-label">Tratamento</span>
                </div>
                <div class="stat-card stat-adotado">
                    <span class="stat-num" id="statAdotado">0</span>
                    <span class="stat-label">Adotados</span>
                </div>
            </div>
        </div>

        <div class="consulta-toolbar">
            <div class="toolbar-btns">
                <a href="registro-animal.html" class="btn-adicionar">Adicionar</a>
                <button class="btn-editar" id="btnEditar" disabled>Editar</button>
                <button class="btn-excluir" id="btnExcluir" disabled>Excluir</button>
            </div>

            <div class="toolbar-actions">
                <div class="filter-wrapper">
                    <button class="btn-icon" id="btnFiltro" title="Filtrar por status">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                        </svg>
                    </button>
                    <div class="filter-dropdown" id="filterDropdown">
                        <button class="filter-opt active" data-status="">Todos</button>
                        <button class="filter-opt" data-status="disponivel">Disponível</button>
                        <button class="filter-opt" data-status="tratamento">Em tratamento</button>
                        <button class="filter-opt" data-status="processo">Em processo</button>
                        <button class="filter-opt" data-status="adotado">Adotado</button>
                    </div>
                </div>

                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor"
                        stroke-width="2" fill="none">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Buscar por nome, raça ou espécie...">
                    <button class="clear-icon" id="clearSearch">X</button>
                </div>
            </div>
        </div>

        <div class="consulta-list">

            <div class="list-header grid-layout">
                <div class="col-checkbox">
                    <input type="checkbox" class="custom-checkbox">
                </div>
                <div class="col-id">#</div>
                <div class="col-nome">Nome do Animal</div>
                <div class="col-perfil">Perfil</div>
                <div class="col-caracteristicas">Características</div>
                <div class="col-entrada">Entrada no Abrigo</div>
                <div class="col-status">Status</div>
            </div>

        </div>
        <div class="pagination">
            <button class="page-btn" title="Página Anterior">
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>

            <button class="page-btn active">1</button>
            <button class="page-btn">2</button>
            <button class="page-btn">3</button>
            <span class="page-dots">...</span>
            <button class="page-btn">12</button>

            <button class="page-btn" title="Próxima Página">
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
        </div>

    </div>
    </div>

    <!-- ── Modal de Solicitação de Adoção ── -->
    <div class="sol-overlay" id="solOverlay">
        <div class="sol-modal">
            <div class="sol-header">
                <h2>Solicitação de Adoção</h2>
                <p id="sol-animal-label">Carregando...</p>
                <button class="sol-close" id="solClose">&#x2715;</button>
            </div>
            <div class="sol-body">
                <div class="sol-field">
                    <label>Nome do adotante</label>
                    <span id="sol-nome">—</span>
                </div>
                <div class="sol-divider"></div>
                <div class="sol-field">
                    <label>E-mail</label>
                    <a id="sol-email" href="#">—</a>
                </div>
                <div class="sol-field">
                    <label>Telefone / WhatsApp</label>
                    <a id="sol-telefone" href="#">—</a>
                </div>
                <div class="sol-divider"></div>
                <div class="sol-field">
                    <label>Mensagem do adotante</label>
                    <div class="sol-mensagem" id="sol-mensagem">—</div>
                </div>
                <div class="sol-field">
                    <label>Data da solicitação</label>
                    <span id="sol-data">—</span>
                </div>
            </div>
            <div class="sol-footer">
                <button class="btn-reprovar" id="btnReprovar">Reprovar</button>
                <button class="btn-aprovar"  id="btnAprovar">Aprovar adoção</button>
            </div>
        </div>
    </div>

</body>

</html>
